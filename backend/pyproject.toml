[project]
name = "echolens"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "KaisoX24", email = "acharjyapramit@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "kokoro>=0.9.4",
    "langchain[google-genai,groq]>=1.3.15",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
echolens = "echolens:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
